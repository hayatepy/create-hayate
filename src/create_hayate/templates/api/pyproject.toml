[project]
name = "$project_name"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["hayate>=0.11.1,<0.12"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "uvicorn>=0.30",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
