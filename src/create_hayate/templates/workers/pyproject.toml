[project]
name = "$project_name"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["hayate>=0.6.0"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "workers-py>=1.15,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
