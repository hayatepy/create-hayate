[project]
name = "$project_name"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "hayate>=0.11.1,<0.12",
  "hayate-mcp>=0.10,<0.11",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "uvicorn>=0.30",
  "workers-py>=1.15,<2",
  "workers-runtime-sdk>=1.6,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
