# Keep SHA-pinned actions and the uv lockfile current without automatically
# changing declared dependency constraints.
version: 2
updates:
  - package-ecosystem: github-actions
    open-pull-requests-limit: 0
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    open-pull-requests-limit: 0
    directory: /
    versioning-strategy: lockfile-only
    schedule:
      interval: weekly
