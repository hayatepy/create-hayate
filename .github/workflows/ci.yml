name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts/check_feature_matrix.py
      - run: uv run ruff format --check src tests scripts/check_feature_matrix.py
      - run: uv run mypy src
      - run: uv run pytest -q

  # The reason this repo exists: every template must generate, resolve its
  # dependencies against PyPI, and pass its own test suite.
  templates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - template: api
            python: "3.14"
          - template: workers
            python: "3.13"
          - template: mcp
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv run create-hayate demo-app --template "$TEMPLATE" --no-input
        env:
          TEMPLATE: ${{ matrix.template }}
      - run: uv sync
        working-directory: demo-app
      - run: uv run pytest -q
        working-directory: demo-app
      - run: uv run ruff check .
        working-directory: demo-app
      - run: uv run ruff format --check .
        working-directory: demo-app
      - if: matrix.template == 'mcp'
        run: bash scripts/check_mcp_asgi_template.sh demo-app

  feature-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run python scripts/check_feature_matrix.py

  golden-asgi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run create-hayate demo-production --template workers --preset production --no-input
      - run: uv sync
        working-directory: demo-production
      - run: uv run pytest -q
        working-directory: demo-production
      - run: uv run ruff check .
        working-directory: demo-production
      - run: uv run ruff format --check .
        working-directory: demo-production
      - run: bash scripts/check_production_asgi_template.sh demo-production

  htmx-asgi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run create-hayate demo-htmx --template api --frontend htmx --no-input
      - run: uv sync
        working-directory: demo-htmx
      - run: uv run pytest -q
        working-directory: demo-htmx
      - run: uv run ruff check .
        working-directory: demo-htmx
      - run: uv run ruff format --check .
        working-directory: demo-htmx
      - run: uv run playwright install --with-deps chromium
        working-directory: demo-htmx
      - run: uv run pytest -m browser -q
        working-directory: demo-htmx
        env:
          HAYATE_HTMX_BROWSER_TESTS: "1"

  react-asgi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/create_hayate/templates/frontends/react/frontend/package-lock.json
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run create-hayate demo-react --template api --frontend react --no-input
      - run: uv sync
        working-directory: demo-react
      - run: uv run pytest -q
        working-directory: demo-react
      - run: npm ci --ignore-scripts
        working-directory: demo-react/frontend
      - run: npm run api:check
        working-directory: demo-react/frontend
      - name: Prove the OpenAPI drift gate rejects stale artifacts
        working-directory: demo-react/frontend
        run: |
          node -e 'require("node:fs").appendFileSync("openapi.json", "\n")'
          if npm run api:check; then
            echo "api:check accepted a stale OpenAPI document" >&2
            exit 1
          fi
          npm run api:generate
      - run: npm run typecheck
        working-directory: demo-react/frontend
      - run: npm run build
        working-directory: demo-react/frontend
      - run: npm audit --audit-level=high
        working-directory: demo-react/frontend
      - run: npx playwright install --with-deps chromium
        working-directory: demo-react/frontend
      - run: npm run test:e2e
        working-directory: demo-react/frontend

  astro-asgi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/create_hayate/templates/frontends/astro/frontend/package-lock.json
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run create-hayate demo-astro --template api --frontend astro --no-input
      - run: uv sync
        working-directory: demo-astro
      - run: uv run pytest -q
        working-directory: demo-astro
      - run: npm ci --ignore-scripts
        working-directory: demo-astro/frontend
      - run: npm run api:check
        working-directory: demo-astro/frontend
      - run: npm run typecheck
        working-directory: demo-astro/frontend
      - run: npm run build
        working-directory: demo-astro/frontend
      - run: npm audit --audit-level=high
        working-directory: demo-astro/frontend
      - run: npx playwright install --with-deps chromium
        working-directory: demo-astro/frontend
      - run: npm run test:e2e
        working-directory: demo-astro/frontend

  # Generate the Workers template and drive CRUD through a real workerd.
  workerd:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        template: [workers, mcp, htmx, react, astro, production, production-global]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: bash scripts/check_workers_template.sh "$TEMPLATE"
        env:
          TEMPLATE: ${{ matrix.template }}

  # Supply-chain audit of these workflows (https://docs.zizmor.sh).
  audit-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --with pip-audit==2.10.0 pip-audit

  lint-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uvx zizmor==1.28.0 .github/workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
