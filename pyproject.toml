[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[project]
name = "create-hayate"
version = "0.7.1"
description = "Compose production Hayate projects for ASGI and Cloudflare Workers"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yusuke Hayashi" }]
keywords = [
  "hayate",
  "scaffolding",
  "project-template",
  "cli",
  "mcp",
  "openapi",
  "sql",
  "cloudflare-workers",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
  "Topic :: Software Development :: Code Generators",
]
dependencies = []

[project.scripts]
create-hayate = "create_hayate.cli:main"

[project.urls]
Repository = "https://github.com/hayatepy/create-hayate"
Documentation = "https://github.com/hayatepy/create-hayate#readme"
Changelog = "https://github.com/hayatepy/create-hayate/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "mypy>=1.18",
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
exclude = ["src/create_hayate/templates"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/create_hayate/templates"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
